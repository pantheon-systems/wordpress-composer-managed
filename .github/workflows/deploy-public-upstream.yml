# .github/workflows/deploy.yml

name: Deploy Public Upstream

# This workflow runs on any push to the 'release' branch
on:
  push:
    branches:
      - release

jobs:
  check-commits:
    name: Check Commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check validity of commits
        run: devops/scripts/check-commits.sh

  deploy-public-upstream:
    name: Deploy Public Upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # This job runs only after the 'check-commits' job completes successfully
    needs: check-commits
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Add SSH Key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy commits to destination repo
        run: devops/scripts/deploy-public-upstream.sh

      - name: Run decoupledpatch.sh and copy commits to decoupled destination repo
        run: devops/scripts/deploy-decoupled-upstream.sh
